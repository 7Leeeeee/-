name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Apple toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build without signing
        run: |
          xcodebuild \
            -project MyTimetable.xcodeproj \
            -scheme MyTimetable \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package sideload-ready IPA variants
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MyTimetable.app"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          codesign --force --sign - --timestamp=none \
            --entitlements Config/Widget.entitlements \
            Payload/MyTimetable.app/PlugIns/MyTimetableWidgets.appex
          codesign --force --sign - --timestamp=none \
            --entitlements Config/App.entitlements \
            Payload/MyTimetable.app
          codesign --verify --deep --strict --verbose=2 Payload/MyTimetable.app
          ditto -c -k --sequesterRsrc --keepParent Payload MyTimetable-resign-ready.ipa

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -rf Payload/MyTimetable.app/PlugIns
          /usr/libexec/PlistBuddy -c "Delete :NSSupportsLiveActivities" \
            Payload/MyTimetable.app/Info.plist || true
          codesign --force --sign - --timestamp=none Payload/MyTimetable.app
          codesign --verify --strict --verbose=2 Payload/MyTimetable.app
          ditto -c -k --sequesterRsrc --keepParent Payload MyTimetable-basic-free-signing.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTimetable-sideload-ready
          path: |
            MyTimetable-resign-ready.ipa
            MyTimetable-basic-free-signing.ipa
          if-no-files-found: error

